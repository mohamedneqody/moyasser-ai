name: Moyasser AI — Formal Verification & Test Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4.36.0 Formal Proof Kernel
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.36.0
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Compile Lean 4 TaxLaw2025 Kernel (10 Theorems, 0 sorry)
        working-directory: lean_kernel
        run: lake build

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install CPU dependencies & run 14-test pytest suite
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev]" pytest
          python -m pytest tests -v
